{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4">👨‍⚕️ Doctor Dashboard</h2>
<div class="row">
    <div class="col-md-6">
        <div class="dashboard-stat stat-blue"><h4>My Active Patients</h4><h2>{{ patients }}</h2></div>
    </div>
    <div class="col-md-6">
        <div class="dashboard-stat stat-purple"><h4>Discharged</h4><h2>{{ discharged }}</h2></div>
    </div>
</div>
<div class="row mt-3">
    <div class="col-12">
        <a href="{% url 'doctor-patient' %}" class="btn btn-primary w-100">View All My Patients</a>
    </div>
</div>
{% endblock %}
