{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="row justify-content-center" style="min-height: 70vh;">
    <div class="col-md-6">
        <div class="card p-4">
            <h3 class="text-center">👑 Admin Signup</h3>
            <form method="POST">
                {% csrf_token %}
                {{ form|crispy }}
                <button class="btn btn-primary w-100 mt-3">Create Admin Account</button>
            </form>
            <p class="mt-3 text-center"><a href="{% url 'adminlogin' %}">Already have an account? Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
