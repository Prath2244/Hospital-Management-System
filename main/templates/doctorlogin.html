{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center" style="min-height: 70vh;">
    <div class="col-md-4">
        <div class="card p-4">
            <h3 class="text-center">🩺 Doctor Login</h3>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <input type="text" name="username" class="form-control" placeholder="Username" required>
                </div>
                <div class="mb-3">
                    <input type="password" name="password" class="form-control" placeholder="Password" required>
                </div>
                <button class="btn btn-primary w-100">Login</button>
            </form>
            <p class="mt-3 text-center"><a href="{% url 'doctor-signup' %}">Don't have an account? Sign up</a></p>
        </div>
    </div>
</div>
{% endblock %}
